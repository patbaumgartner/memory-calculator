name: Build and Test

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]  # Trigger on version tags
  pull_request:
    branches: [ main ]

permissions:
  contents: write
  packages: write
  actions: read
  security-events: write

env:
  GO_VERSION: '1.25'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Verify build and cross-compilation
      run: |
        set -euo pipefail
        go build -trimpath -ldflags "-s -w" -o test-binary ./cmd/memory-calculator
        ./test-binary --version
        rm test-binary
        for target in linux/arm64 darwin/amd64 darwin/arm64; do
          echo "Cross-compiling for $target"
          CGO_ENABLED=0 GOOS=${target%/*} GOARCH=${target#*/} \
            go build -trimpath -o /dev/null ./cmd/memory-calculator
        done

    - name: Check formatting
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "These files are not gofmt-formatted:"
          echo "$unformatted"
          gofmt -d .
          exit 1
        fi

    - name: Run tests
      run: go test -v -race -timeout=10m -coverprofile=coverage.out ./...
      env:
        CGO_ENABLED: 1

    - name: Run behaviour smoke test
      run: ./test-local.sh

    - name: Generate coverage report
      run: go tool cover -func=coverage.out

    - name: Run linting
      uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
      with:
        version: v2.7.2
        args: --timeout=5m --config .golangci.yml
        working-directory: .

    - name: Run security scan
      uses: securego/gosec@deb54465fea23d19a77f037e11e6589021f8501d # v2.29.0
      with:
        args: '-severity medium -confidence medium ./...'

    - name: Check for vulnerabilities
      run: |
        go install golang.org/x/vuln/cmd/govulncheck@latest
        govulncheck ./...

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: ./coverage.out
        flags: unittests
        name: codecov-umbrella
        fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0  # Fetch all history for proper versioning

    - name: Set up Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: ${{ env.GO_VERSION }}
        cache: true

    - name: Download dependencies
      run: go mod download

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev-${GITHUB_SHA::8}")
        BUILD_TIME=$(date -u '+%Y-%m-%d_%H:%M:%S')
        COMMIT_HASH=${GITHUB_SHA::8}
        
        mkdir -p dist
        
        # Build standard binary
        BINARY_NAME="memory-calculator-${{ matrix.goos }}-${{ matrix.goarch }}"
        env CGO_ENABLED=0 go build \
          -trimpath -a \
          -ldflags "-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.commitHash=${COMMIT_HASH} -s -w" \
          -o "dist/${BINARY_NAME}" \
          ./cmd/memory-calculator
        
        # DEPRECATED: the minimal build variant was removed because it used a different,
        # less accurate class-counting algorithm and shipped untested. The legacy filename is
        # still published as a copy of the standard binary so existing download URLs keep
        # working, and will be dropped in the next major release.
        cp "dist/${BINARY_NAME}" "dist/memory-calculator-minimal-${{ matrix.goos }}-${{ matrix.goarch }}"
        
        # Build static binary (Linux only)
        if [ "${{ matrix.goos }}" = "linux" ]; then
          STATIC_BINARY_NAME="memory-calculator-static-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          # Install cross-compiler for ARM64
          if [ "${{ matrix.goarch }}" = "arm64" ]; then
            echo "Installing ARM64 cross-compiler..."
            sudo apt-get update || { echo "Failed to update package list"; exit 1; }
            sudo apt-get install -y gcc-aarch64-linux-gnu || { echo "Failed to install cross-compiler"; exit 1; }
            export CC=aarch64-linux-gnu-gcc
            echo "Cross-compiler installed successfully"
          fi
          
          env CGO_ENABLED=1 go build \
            -trimpath -a \
            -ldflags "-X main.version=${VERSION} -X main.buildTime=${BUILD_TIME} -X main.commitHash=${COMMIT_HASH} -s -w -linkmode external -extldflags '-static'" \
            -o "dist/${STATIC_BINARY_NAME}" \
            ./cmd/memory-calculator
        fi

    - name: Upload standard build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: memory-calculator-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/memory-calculator-${{ matrix.goos }}-${{ matrix.goarch }}
        retention-days: 7

    - name: Upload deprecated minimal-named artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: memory-calculator-minimal-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/memory-calculator-minimal-${{ matrix.goos }}-${{ matrix.goarch }}
        retention-days: 7

    - name: Upload static build artifacts
      if: matrix.goos == 'linux'
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: memory-calculator-static-${{ matrix.goos }}-${{ matrix.goarch }}
        path: dist/memory-calculator-static-${{ matrix.goos }}-${{ matrix.goarch }}
        retention-days: 7

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [test, build]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    - name: Create dist directory
      run: mkdir -p dist

    - name: Download all build artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts

    - name: Organize artifacts for release
      run: |
        echo "Organizing artifacts for release..."
        
        # Move all artifacts to dist directory
        find artifacts -type f -name "memory-calculator*" -exec mv {} dist/ \;
        
        # List all files that will be released
        echo "Files to be released:"
        ls -la dist/
        
        # Verify we have the expected files
        expected_files=(
          "memory-calculator-linux-amd64"
          "memory-calculator-linux-arm64"
          "memory-calculator-darwin-amd64"
          "memory-calculator-darwin-arm64"
          "memory-calculator-minimal-linux-amd64"
          "memory-calculator-minimal-linux-arm64"
          "memory-calculator-minimal-darwin-amd64"
          "memory-calculator-minimal-darwin-arm64"
          "memory-calculator-static-linux-amd64"
          "memory-calculator-static-linux-arm64"
        )
        
        missing_files=()
        for file in "${expected_files[@]}"; do
          if [ ! -f "dist/$file" ]; then
            missing_files+=("$file")
          fi
        done
        
        if [ ${#missing_files[@]} -gt 0 ]; then
          echo "Missing expected release files:"
          printf '%s\n' "${missing_files[@]}"
          exit 1
        fi
        
        # Create checksums
        cd dist
        sha256sum * > checksums.txt
        echo "Checksums created:"
        cat checksums.txt

    - name: Create Release
      uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
      with:
        files: |
          dist/*
        generate_release_notes: true
        draft: false
        prerelease: false
        make_latest: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
    - name: Checkout code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

    - name: Log in to Docker Hub
      uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
      with:
        images: ${{ secrets.DOCKER_USERNAME }}/memory-calculator
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{version}}
          type=semver,pattern={{major}}.{{minor}}
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Set build time
      id: build_time
      run: echo "time=$(date -u '+%Y-%m-%d_%H:%M:%S')" >> $GITHUB_OUTPUT

    - name: Build Docker image for tests
      run: |
        docker build \
          --target alpine \
          --tag memory-calculator:test \
          --build-arg VERSION=${{ github.ref_name }} \
          --build-arg BUILD_TIME=${{ steps.build_time.outputs.time }} \
          --build-arg COMMIT_HASH=${{ github.sha }} \
          .

    - name: Test Docker image
      run: |
        set -euo pipefail
        IMAGE=memory-calculator:test

        echo "Testing --version:"
        docker run --rm "$IMAGE" --version

        echo "Testing explicit memory:"
        docker run --rm --memory=1g "$IMAGE" --total-memory=1G --loaded-class-count=5000 --quiet

        # The point of the tool: with no --total-memory it must read the cgroup limit.
        # A heap sized for the host rather than the 512m limit would be far larger.
        # The thread count is lowered because 250 stacks plus the code cache exceed 512m on
        # their own, which would fail before the limit could be observed.
        echo "Testing cgroup limit detection:"
        HEAP=$(docker run --rm --memory=512m "$IMAGE" --loaded-class-count=5000 --thread-count=50 --path=/tmp --quiet \
          | tr ' ' '\n' | grep '^-Xmx')
        echo "detected heap: $HEAP"
        BYTES=$(echo "$HEAP" | sed 's/-Xmx//; s/K$//')
        if [ "$BYTES" -gt 400000 ] || [ "$BYTES" -lt 50000 ]; then
          echo "Heap $HEAP is not consistent with a 512m container limit"
          exit 1
        fi

        echo "Testing that invalid input fails loudly:"
        if docker run --rm "$IMAGE" --total-memory=banana --quiet 2>/dev/null; then
          echo "Expected a non-zero exit for invalid input"
          exit 1
        fi

        echo "Docker image tests completed successfully"

    - name: Build and push multi-platform Docker image
      uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
      with:
        context: .
        file: Dockerfile
        target: alpine
        platforms: linux/amd64,linux/arm64
        push: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha,scope=docker-build
        cache-to: type=gha,mode=max,scope=docker-build
        build-args: |
          VERSION=${{ github.ref_name }}
          BUILD_TIME=${{ steps.build_time.outputs.time }}
          COMMIT_HASH=${{ github.sha }}
